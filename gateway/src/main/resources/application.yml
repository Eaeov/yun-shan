server:
  port: 8080

spring:
  application:
    name: gateway
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:gateway-dev.yml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      server-addr: 192.168.100.128:8848
      config:
        file-extension: yml
        group: DEFAULT_GROUP
        refresh-enabled: true
    gateway:
      default-filters:
        - name: RemoveRequestHeader
          args:
            name: X-Forwarded-For
      filter:
        - name: CustomForwardedHeadersFilter
      routes:
        - id: cart-service-shoppingCart
          uri: lb://cart-service
          predicates:
            - Path=/user/shoppingCart/**

        - id: cart-service-user-shop
          uri: lb://cart-service
          predicates:
            - Path=/user/shop/**

        - id: cart-service-admin-shop
          uri: lb://cart-service
          predicates:
            - Path=/admin/shop/**

        - id: order-service-user
          uri: lb://order-service
          predicates:
            - Path=/user/order/**

        - id: order-service-admin
          uri: lb://order-service
          predicates:
            - Path=/admin/order/**

        - id: product-service-user-dish
          uri: lb://product-service
          predicates:
            - Path=/user/dish/**

        - id: product-service-user-setmeal
          uri: lb://product-service
          predicates:
            - Path=/user/setmeal/**

        - id: product-service-user-category
          uri: lb://product-service
          predicates:
            - Path=/user/category/**

        - id: product-service-admin-dish
          uri: lb://product-service
          predicates:
            - Path=/admin/dish/**

        - id: product-service-admin-setmeal
          uri: lb://product-service
          predicates:
            - Path=/admin/setmeal/**

        - id: product-service-admin-category
          uri: lb://product-service
          predicates:
            - Path=/admin/category/**

        - id: product-service-admin-common
          uri: lb://product-service
          predicates:
            - Path=/admin/common/**

        - id: product-service-common-upload
          uri: lb://product-service
          predicates:
            - Path=/common/upload/**

        - id: product-service-user-dish-review
          uri: lb://product-service
          predicates:
            - Path=/user/dish-review/**

        - id: product-service-admin-dish-review
          uri: lb://product-service
          predicates:
            - Path=/admin/dish-review/**

        - id: user-service-user
          uri: lb://user-service
          predicates:
            - Path=/user/user/**

        - id: user-service-addressbook
          uri: lb://user-service
          predicates:
            - Path=/user/addressBook/**

        - id: user-service-user-merchant
          uri: lb://user-service
          predicates:
            - Path=/user/merchant/**

        - id: user-service-admin-employee
          uri: lb://user-service
          predicates:
            - Path=/admin/employee/**

        - id: user-service-admin-merchant
          uri: lb://user-service
          predicates:
            - Path=/admin/merchant/**

        - id: user-service-admin-report
          uri: lb://user-service
          predicates:
            - Path=/admin/report/**

        - id: user-service-admin-workspace
          uri: lb://user-service
          predicates:
            - Path=/admin/workspace/**

        - id: chat-ai
          uri: lb://chat-ai
          predicates:
            - Path=/api/**

        - id: order-service-websocket
          uri: lb://order-service
          predicates:
            - Path=/ws/**

# ============================================================
# 网关路由与日志配置保留在本地（普通配置不入 Nacos）
# JWT 校验密钥等敏感配置已迁回本地（sky.jwt），Nacos gateway-dev.yml 不再维护
# ============================================================

sky:
  jwt:
    admin-secret-key: 8d7f3a2c9b1e5f6a4d2e8c0b3a7f1d6e5c9b2a8f4e1d7c6b3a0f5e2d8c4b7a
    admin-ttl: 604800000
    admin-token-name: Token
    user-secret-key: f1a6b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2
    user-ttl: 604800000
    user-token-name: Authentication
  gateway:
    secret-key: 220secretKey

logging:
  level:
    root: info
    com.zyj.gateway.filters: debug
